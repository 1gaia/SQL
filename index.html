<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SQL LAB — 프로그래밍기능사 SQL 실습</title>
<style>:root{--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--line:#d0d7de;--text:#1f2328;--muted:#59636e;--accent:#0969da;--accent-bg:#ddf4ff;--good:#1a7f37;--good-bg:#dafbe1;--bad:#cf222e;--bad-bg:#ffebe9;--warn:#9a6700;--warn-bg:#fff8c5;--xp:#8250df;--xp-bg:#fbefff;--code-bg:#f6f8fa;--shadow:0 1px 3px rgba(31,35,40,.12);--kw:#cf222e;--st:#0a3069;--nm:#0550ae;--cm:#6e7781;--ty:#8250df;--fn:#116329;--add:#dafbe1;--chg:#fff3b0;--del:#ffe0de}
:root[data-theme="dark"]{--bg:#0d1117;--panel:#161b22;--panel2:#1c232c;--line:#30363d;--text:#e6edf3;--muted:#9aa4af;--accent:#58a6ff;--accent-bg:#102a4c;--good:#3fb950;--good-bg:#12301c;--bad:#ff7b72;--bad-bg:#3b1618;--warn:#d29922;--warn-bg:#352a0b;--xp:#bc8cff;--xp-bg:#2a1d44;--code-bg:#0d1117;--shadow:none;--kw:#ff7b72;--st:#a5d6ff;--nm:#79c0ff;--cm:#8b949e;--ty:#d2a8ff;--fn:#7ee787;--add:#12301c;--chg:#4a3a0a;--del:#3b1618}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.65;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
code,pre,textarea.sql,.mono{font-family:"D2Coding",Consolas,"SF Mono",Menlo,monospace}
code{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:.92em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kw{color:var(--kw);font-weight:600}.st{color:var(--st)}.nm{color:var(--nm)}.cm{color:var(--cm);font-style:italic}.ty{color:var(--ty)}.fn{color:var(--fn)}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hin{max-width:1480px;margin:0 auto;padding:8px 14px;display:flex;align-items:center;gap:10px}
.sp{flex:1}
.logo{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;cursor:pointer}
.logo b{font-family:Consolas,monospace;font-size:20px}.logo b i{font-style:normal;color:var(--accent)}.logo small{color:var(--muted);font-size:12px}
.gp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.gp .bar{width:90px;height:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gp .bar div{height:100%;background:var(--good);width:0;transition:width .3s}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.iconbtn:hover{border-color:var(--accent)}
.menu,.dbtog{display:none}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--accent)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}.btn.small{padding:3px 10px;min-height:32px;font-size:14px}.btn.big{padding:12px 24px;font-size:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr) 340px;gap:0;align-items:start}
.nav{position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;padding:12px 8px 24px 12px;border-right:1px solid var(--line)}
.nav a{display:grid;grid-template-columns:24px 1fr auto;column-gap:6px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--text);font-size:14px;line-height:1.35;border:1px solid transparent}
.nav a:hover{background:var(--panel2)}.nav a.on{background:var(--accent-bg);border-color:var(--accent)}
.nav a.home{display:block;font-weight:700;margin-bottom:6px}
.nav .no{width:22px;height:22px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.nav a.done .no{background:var(--good);color:#fff;border-color:var(--good)}
.nav .min{grid-column:2;font-size:11px;color:var(--muted)}.nav .sc{grid-column:3;grid-row:1/3;font-size:12px;color:var(--muted)}.nav a.done .sc{color:var(--good);font-weight:700}
.main{padding:18px 22px 60px;min-width:0}
.db{position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;border-left:1px solid var(--line);background:var(--bg)}
.dbh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.dbx{display:none}.dbbody{padding:10px}
.dbt{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:10px}
.tname{display:flex;align-items:center;gap:6px}.tname .cnt{color:var(--muted);font-size:12px}.vtag{font-size:10px;background:var(--xp-bg);color:var(--xp);border-radius:4px;padding:0 5px;font-weight:700}
.cols{display:flex;flex-wrap:wrap;gap:4px 10px;margin:4px 0;font-size:12.5px}.col i{font-style:normal;color:var(--muted);font-size:11px}
.bg{font-style:normal;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:3px}
.bg.pk{background:var(--warn-bg);color:var(--warn)}.bg.fk{background:var(--accent-bg);color:var(--accent)}.bg.nn{background:var(--panel2);color:var(--muted)}.bg.uq{background:var(--xp-bg);color:var(--xp)}
.chk{font-size:12px;color:var(--muted)}.vsql{margin:4px 0;font-size:12px;white-space:pre-wrap;color:var(--muted)}
.txbadge{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:13px;font-weight:600}
.idxs{font-size:12.5px;margin:6px 0}.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:0 9px;margin:2px 3px 2px 0;background:var(--panel);font-size:12px}
.muted{color:var(--muted)}
/* 본문 */
.lhead{margin-bottom:14px}.lno{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.5px}
h1{font-size:26px;line-height:1.3;margin:2px 0 8px}
.goal{background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;font-size:15px}
h2.sec{font-size:19px;margin:30px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.para{margin:10px 0}
.callout{border-radius:10px;padding:9px 13px;margin:12px 0;border:1px solid}.callout.tip{background:var(--good-bg);border-color:var(--good)}.callout.warn{background:var(--warn-bg);border-color:var(--warn)}
.syn{font-family:Consolas,"D2Coding",monospace;background:var(--code-bg);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:9px 14px;margin:10px 0;overflow:auto;font-size:15px}
.syn b{color:var(--accent)}
.terms{display:grid;grid-template-columns:max-content 1fr;gap:1px 14px;margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.terms dt{font-weight:700;padding:5px 0;border-bottom:1px dashed var(--line)}.terms dd{margin:0;padding:5px 0;border-bottom:1px dashed var(--line)}
.terms dt:nth-last-of-type(1),.terms dd:last-child{border-bottom:0}
.tw{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
.cmp th,.cmp td{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;font-size:14.5px;vertical-align:top}.cmp thead th{background:var(--panel2)}.cmp tbody th{white-space:nowrap}
.cmp{min-width:480px}
.rt{font-size:14px;width:auto;min-width:min(100%,320px)}.rt th,.rt td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rt thead th{background:var(--panel2);position:sticky;top:0;font-size:13px}
.rt td.num{text-align:right;font-variant-numeric:tabular-nums}.null{color:var(--muted);font-style:italic;font-size:12px;background:var(--warn-bg);padding:0 5px;border-radius:4px}
.rt td.empty{color:var(--muted);text-align:center;padding:14px}.rt .mk{width:24px;text-align:center;font-weight:700;color:var(--muted)}
.rt tr.add td{background:var(--add)}.rt tr.chg td{background:var(--chg)}.rt tr.del td{background:var(--del);text-decoration:line-through;color:var(--muted)}
.rt tr.add .mk{color:var(--good)}.rt tr.del .mk{color:var(--bad)}
.rt td.chgcell{background:var(--chg);font-weight:700;outline:2px solid var(--warn);outline-offset:-2px}.rt td.chgcell s{color:var(--muted);font-weight:400}
.rt tr.dim td{opacity:.35;text-decoration:line-through}.rt tr.ghead td{background:var(--accent-bg);font-weight:700;font-size:13px}.rt tr.ghead.dim td{text-decoration:none}
.more{padding:6px 10px;font-size:12px;color:var(--muted)}
/* 에디터 */
.blk{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0;box-shadow:var(--shadow)}
.note{font-size:14.5px;margin-bottom:8px}
.asuser{display:inline-block;background:var(--xp-bg);color:var(--xp);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;margin-bottom:6px}
.ed{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--code-bg);overflow:hidden}
.ed pre.hlpre,.ed textarea.sql{margin:0;padding:10px 12px;font-size:15px;line-height:1.65;white-space:pre;tab-size:2;width:100%;border:0;letter-spacing:0;overflow:auto}
.ed pre.hlpre{position:absolute;inset:0;pointer-events:none;overflow:hidden;color:var(--text)}
.ed textarea.sql{position:relative;display:block;background:transparent;color:transparent;caret-color:var(--text);resize:none;outline:none;min-height:3.4em}
.ed:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.ed textarea.sql::selection{background:color-mix(in srgb,var(--accent) 35%,transparent);color:transparent}
pre.code{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:15px;overflow:auto;white-space:pre-wrap}
.btns{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}.hint{font-size:12px;color:var(--muted)}
.out{margin-top:8px}.resbox{margin-top:8px}
.cap{font-size:13px;color:var(--muted);margin:6px 0 3px;font-weight:600}.echo{font-family:Consolas,monospace;font-size:12.5px;color:var(--muted);margin-bottom:2px}
.okmsg{background:var(--good-bg);border:1px solid var(--good);border-radius:8px;padding:6px 12px;margin-bottom:6px;font-size:14.5px}
.res.msg.ddl .okmsg{background:var(--accent-bg);border-color:var(--accent)}
.errmsg{background:var(--bad-bg);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;color:var(--text);word-break:break-word}
.errmsg b{color:var(--bad)}.skip,.errtip{font-size:13px;color:var(--muted);margin-top:4px}
.good.big,.bad.big{margin-top:8px;border-radius:8px;padding:8px 12px;font-weight:600}.good.big{background:var(--good-bg);border:1px solid var(--good)}.bad.big{background:var(--bad-bg);border:1px solid var(--bad)}
.mission{border-left:5px solid var(--xp)}.mission.done{border-left-color:var(--good)}
.mtag,.qtag{font-size:13px;font-weight:700;color:var(--xp);margin-bottom:4px}.mstat{color:var(--good)}
.qtag{color:var(--accent)}
.mq,.qq{font-size:16px;margin:4px 0 6px}
.prev{margin:6px 0;font-size:14px}.prev summary{cursor:pointer;color:var(--accent);font-weight:600}
.hints .hint-i{background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:6px 12px;margin-top:6px;font-size:14.5px}
.sol{margin-top:8px}
/* 퀴즈 */
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-bg)}
.opt .ol{flex:0 0 24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.opt .ot{word-break:break-word}
.opt.right{border-color:var(--good);background:var(--good-bg)}.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default;opacity:.85}
.fb .good{color:var(--good);font-weight:700}.fb .bad{color:var(--bad);font-weight:700}.why{background:var(--panel2);border-radius:8px;padding:8px 12px;margin-top:6px;font-size:14.5px}
/* 단계 장치 */
.stepbar,.jtabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.stp{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;cursor:pointer;font-weight:600;font-size:14px}
.stp i{font-style:normal;display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--panel2);margin-right:6px;font-size:12px}
.stp.on{background:var(--accent);color:#fff;border-color:var(--accent)}.stp.on i{background:rgba(255,255,255,.25)}.stp.past{border-color:var(--good)}.stp.skip{opacity:.55}
.stepdesc{background:var(--accent-bg);border:1px solid var(--accent);border-radius:8px;padding:8px 12px;margin:8px 0}
.jgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.jcol.wide{grid-column:1/-1}
.rt tr.hit td{background:var(--chg);box-shadow:inset 0 0 0 1px var(--warn)}
.rt td.nullhl .null{background:var(--warn);color:#fff}
.rt tbody tr[class]:hover td{filter:brightness(.97)}
.joinviz .rt tbody tr{cursor:pointer}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:8px;font-size:14px}.sel{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;min-height:36px}
/* 홈 */
.hero{text-align:center;padding:30px 10px 14px}.hero h1{font-size:44px;margin:4px 0}.acc{color:var(--accent)}.sub{color:var(--muted);font-size:17px;margin:4px 0 16px}.hero .btns{justify-content:center}
.howto{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.ho{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.ho b{display:block;color:var(--accent)}.ho span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.lcard{display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;width:100%}.lcard:hover{border-color:var(--accent)}
.lcard .ln{flex:0 0 34px;height:34px;border-radius:50%;background:var(--accent-bg);color:var(--accent);display:grid;place-items:center;font-weight:800}.lcard.done .ln{background:var(--good);color:#fff}.lcard .ls{font-size:12.5px;color:var(--muted)}
.foot{color:var(--muted);font-size:13px;margin-top:18px}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:30px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:#1f2328;color:#fff;padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}#toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu,.dbtog{display:inline-block}.logo small{display:none}.gp .bar{width:50px}
  .nav,.db{position:fixed;top:53px;bottom:0;z-index:40;background:var(--bg);box-shadow:0 0 30px rgba(0,0,0,.3);transition:transform .25s;height:auto}
  .nav{left:0;width:min(300px,86vw);transform:translateX(-105%)}
  .db{right:0;width:min(420px,94vw);transform:translateX(105%);border-left:1px solid var(--line)}
  body.navopen .nav,body.dbopen .db{transform:none}
  body.navopen .scrim,body.dbopen .scrim{display:block;position:fixed;inset:53px 0 0 0;background:rgba(0,0,0,.4);z-index:35}
  .dbx{display:inline-block}
  .main{padding:14px 14px 60px}
}
@media (max-width:640px){
  h1{font-size:22px}.hero h1{font-size:34px}.howto{grid-template-columns:1fr 1fr}.jgrid{grid-template-columns:1fr}
  .terms{grid-template-columns:1fr}.terms dt{border-bottom:0;padding-bottom:0}.gp span{display:none}
  .hin{padding:6px 10px;gap:6px}.btn{padding:8px 12px}
  .ed pre.hlpre,.ed textarea.sql{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* MiniSQL — 학습용 SQL 엔진 (SELECT/JOIN/GROUP BY/HAVING/ORDER BY/INSERT/UPDATE/DELETE)
   외부 라이브러리 없이 브라우저에서 동작한다. */
(function (root) {
  'use strict';
  var KW = new Set(['SELECT','FROM','WHERE','GROUP','BY','HAVING','ORDER','ASC','DESC','LIMIT','JOIN','INNER','LEFT','RIGHT','OUTER','CROSS','ON','AS','AND','OR','NOT','NULL','IS','IN','LIKE','BETWEEN','DISTINCT','INSERT','INTO','VALUES','UPDATE','SET','DELETE','COMMIT','ROLLBACK','GRANT','REVOKE','CREATE','DROP','TABLE','UNION','ALL','INTERSECT','EXCEPT','MINUS','EXISTS','CASE','WHEN','THEN','ELSE','END','OFFSET','FULL']);
  var AGG = { COUNT: 1, SUM: 1, AVG: 1, MAX: 1, MIN: 1 };

  function SqlError(msg) { this.message = msg; }
  SqlError.prototype = Object.create(Error.prototype);
  function err(m) { throw new SqlError(m); }

  function tokenize(src) {
    var re = /\s+|--[^\n]*|('(?:[^']|'')*')|("(?:[^"]|"")*")|(\d+\.\d+|\d+)|([\p{L}_][\p{L}\p{N}_]*)|(<>|!=|<=|>=|\|\||[=<>(),.*+\-\/%;])|(.)/uy;
    var toks = [], m; re.lastIndex = 0;
    while (re.lastIndex < src.length) {
      var start = re.lastIndex; m = re.exec(src);
      if (!m) break;
      if (m[1] !== undefined) toks.push({ t: 'str', v: m[1].slice(1, -1).replace(/''/g, "'"), s: start, e: re.lastIndex });
      else if (m[2] !== undefined) toks.push({ t: 'id', v: m[2].slice(1, -1), s: start, e: re.lastIndex, q: true });
      else if (m[3] !== undefined) toks.push({ t: 'num', v: parseFloat(m[3]), f: /[.eE]/.test(m[3]), s: start, e: re.lastIndex });
      else if (m[4] !== undefined) { var up = m[4].toUpperCase(); toks.push(KW.has(up) ? { t: 'kw', v: up, raw: m[4], s: start, e: re.lastIndex } : { t: 'id', v: m[4], s: start, e: re.lastIndex }); }
      else if (m[5] !== undefined) toks.push({ t: 'op', v: m[5], s: start, e: re.lastIndex });
      else if (m[6] !== undefined) err('unrecognized token: "' + m[6] + '"');
    }
    return toks;
  }

  function Parser(src) { this.src = src; this.toks = tokenize(src); this.i = 0; }
  var P = Parser.prototype;
  P.peek = function (o) { return this.toks[this.i + (o || 0)]; };
  P.near = function () { var t = this.peek(); return t ? 'near "' + this.src.slice(t.s, t.e) + '": syntax error' : 'incomplete input'; };
  P.isKw = function (v, o) { var t = this.peek(o); return t && t.t === 'kw' && t.v === v; };
  P.isOp = function (v) { var t = this.peek(); return t && t.t === 'op' && t.v === v; };
  P.eatKw = function (v) { if (this.isKw(v)) { this.i++; return true; } return false; };
  P.eatOp = function (v) { if (this.isOp(v)) { this.i++; return true; } return false; };
  P.needKw = function (v) { if (!this.eatKw(v)) err(this.near()); };
  P.needOp = function (v) { if (!this.eatOp(v)) err(this.near()); };
  P.ident = function () { var t = this.peek(); if (t && t.t === 'id') { this.i++; return t.v; } err(this.near()); };

  P.statements = function () {
    var out = [];
    while (this.i < this.toks.length) {
      if (this.eatOp(';')) continue;
      out.push(this.statement());
      if (this.i < this.toks.length && !this.isOp(';')) err(this.near());
    }
    return out;
  };
  P.statement = function () {
    var t = this.peek();
    if (!t) err('incomplete input');
    if (t.t === 'kw') {
      switch (t.v) {
        case 'SELECT': return this.compound();
        case 'INSERT': return this.insert();

    WARN('<code>WHERE 학과 = IT</code> 처럼 따옴표를 빼면 IT를 "열 이름"으로 착각해서 오류가 나요. 직접 해서 오류 메시지를 읽어 보세요!'),
    TRY('SELECT * FROM 학생 WHERE 학과 = IT;', '일부러 틀린 예. 오류가 나도 괜찮아요. 오류 메시지 읽는 연습!'),
    H('2. 조건 여러 개: AND / OR / NOT'),
    { t: 'terms', items: [['AND', '두 조건을 <b>모두</b> 만족 (교집합)'], ['OR', '<b>하나라도</b> 만족 (합집합)'], ['NOT', '조건을 뒤집기']] },
    TRY("SELECT 이름 FROM 학생 WHERE 학과 = 'IT' AND 점수 >= 80;", 'IT이면서 80점 이상 → 민수(82), 수빈(95)'),
    TRY("SELECT 이름 FROM 학생 WHERE 학과 = 'IT' OR 점수 >= 80;", '같은 조건을 OR로 바꾸면 훨씬 많이 나와요.'),
    WARN('<b>AND가 OR보다 먼저 계산돼요</b>(곱셈이 덧셈보다 먼저인 것처럼). 순서를 바꾸고 싶으면 괄호 ( ) 를 써요.'),
    TRY("SELECT 이름, 학과, 점수 FROM 학생 WHERE 학과 = '게임' OR 학과 = 'IT' AND 점수 >= 90;", 'AND 먼저: (IT이고 90 이상) 또는 (게임). 결과를 보고 어떤 행이 나왔는지 확인하세요.'),
    TRY("SELECT 이름, 학과, 점수 FROM 학생 WHERE (학과 = '게임' OR 학과 = 'IT') AND 점수 >= 90;", '괄호를 치면 의미가 달라져요. 결과가 어떻게 바뀌었나요?'),
    H('3. 편리한 조건: BETWEEN · IN · LIKE'),
    TRY('SELECT * FROM 학생 WHERE 점수 BETWEEN 80 AND 90;', 'BETWEEN a AND b 는 a 이상 b 이하 (양 끝 포함!)'),
    TRY("SELECT * FROM 학생 WHERE 학과 IN ('IT', '게임');", 'IN (…)은 목록 중 하나와 같으면 OK. OR를 여러 번 쓴 것과 같아요.'),
    TRY("SELECT 이름 FROM 학생 WHERE 이름 LIKE '%수%';", 'LIKE는 글자 패턴 검색. % 는 "아무 글자 0개 이상", _ 는 "아무 글자 딱 1개"'),
    TRY("SELECT 이름 FROM 학생 WHERE 이름 LIKE '지_';", '_ 는 정확히 한 글자. "지"로 시작하는 2글자 이름!'),
    H('4. NULL — 값이 "없음"'),
    P('NULL은 0도 빈 글자도 아닌 <b>"값이 없다(모른다)"</b>는 뜻이에요. 그래서 <code>= NULL</code>로는 비교할 수 없고, 반드시 <b>IS NULL / IS NOT NULL</b>을 써야 해요.'),
    TRY('SELECT * FROM 학생 WHERE 점수 = NULL;', '아무것도 안 나와요! NULL과의 = 비교는 항상 "알 수 없음"이라 행이 걸러져요.'),
    TRY('SELECT * FROM 학생 WHERE 점수 IS NULL;', '이렇게 써야 하늘이 나와요.'),
    TRY('SELECT * FROM 학생 WHERE 점수 <> 82;', '하늘이 없어요! NULL은 "82가 아님"도 참이 아니에요. NULL은 비교 대상에서 빠져요.'),
    QUIZ('SELECT 이름 FROM 학생 WHERE 학과 = \'IT\' AND 점수 >= 80;', ['민수, 서준, 수빈', '민수, 지민, 수빈, 예은', '수빈'], 'IT 학생은 민수(82)·서준(76)·수빈(95). 이 중 80 이상은 민수와 수빈이에요.', { data: 'school_null' }),
    QUIZ('SELECT 이름 FROM 학생 WHERE 점수 BETWEEN 80 AND 90;', ['민수, 예은, 수빈', '민수, 지민, 예은', '예은'], 'BETWEEN은 양 끝을 포함해요. 82(민수), 88(예은)이 해당돼요. 91, 95는 90을 넘어요.', { data: 'school_null' }),
    QUIZ('SELECT 이름 FROM 학생 WHERE 점수 <> 82;', ['지민, 서준, 수빈, 예은, 도윤, 하늘', '민수, 하늘', '(결과 없음)'], '점수가 NULL인 하늘은 비교 결과가 "알 수 없음"이라 조건을 통과하지 못해요. 그래서 하늘은 빠진 5명이 나와요.', { data: 'school_null' }),
    QUIZ("SELECT 이름 FROM 학생 WHERE 이름 LIKE '%은';", ['예은', '예은, 도윤', '민수, 서준, 수빈'], "'%은'은 '은'으로 끝나는 이름이에요. 예은만 해당돼요.", { data: 'school_null' }),
    MISSION('m3-1', '<b>게임</b>학과 학생의 <b>이름</b>과 <b>점수</b>를 조회하세요.', "SELECT 이름, 점수 FROM 학생 WHERE 학과 = '게임'", ['WHERE 학과 = ... 를 써요. 글자는 작은따옴표!']),
    MISSION('m3-2', '<b>IT 학과이면서 80점 이상</b>인 학생의 이름을 조회하세요.', "SELECT 이름 FROM 학생 WHERE 학과 = 'IT' AND 점수 >= 80", ['두 조건을 모두 만족해야 해요 → AND', "WHERE 학과 = 'IT' AND 점수 >= 80"]),
    MISSION('m3-3', '점수가 <b>85점 이상 95점 이하</b>인 학생의 이름을 BETWEEN으로 조회하세요.', 'SELECT 이름 FROM 학생 WHERE 점수 BETWEEN 85 AND 95', ['BETWEEN 작은값 AND 큰값']),
    MISSION('m3-4', '이름에 <b>"수"</b>가 들어간 학생의 이름을 조회하세요.', "SELECT 이름 FROM 학생 WHERE 이름 LIKE '%수%'", ['글자 패턴 검색은 LIKE, 앞뒤에 아무 글자가 와도 되면 %…%']),
    MISSION('m3-5', '<b>점수가 입력되지 않은</b>(NULL) 학생의 이름을 조회하세요.', 'SELECT 이름 FROM 학생 WHERE 점수 IS NULL', ['NULL 검사는 = 가 아니에요.', 'IS NULL 을 써요.'])
  ] });

LESSONS.push({ id: 'L4', title: '줄 세우기와 개수 제한', min: 7, data: 'school',
  goal: 'ORDER BY로 정렬하고 LIMIT/OFFSET으로 상위 N개만 가져올 수 있다.',
  blocks: [
    P('SQL은 따로 말하지 않으면 결과의 <b>순서를 보장하지 않아요</b>. 순서가 필요하면 <code>ORDER BY</code>를 꼭 써야 해요. ORDER BY는 SELECT 문의 <b>맨 마지막</b>에 와요.'),
    SYN('SELECT … FROM … WHERE … <b>ORDER BY 열 [ASC | DESC]</b>;'),
    { t: 'terms', items: [['ASC', '오름차순 (작은 값 → 큰 값). <b>생략하면 이게 기본값</b>이에요.'], ['DESC', '내림차순 (큰 값 → 작은 값)']] },
    TRY('SELECT 이름, 점수 FROM 학생 ORDER BY 점수;', '아무것도 안 쓰면 ASC! 낮은 점수부터.'),
    TRY('SELECT 이름, 점수 FROM 학생 ORDER BY 점수 DESC;', '높은 점수부터.'),
    TRY('SELECT 이름, 학과, 점수 FROM 학생 ORDER BY 학과, 점수 DESC;', '여러 기준: 학과 순으로 먼저 정렬하고, 같은 학과 안에서는 점수 높은 순.'),
    TRY('SELECT 이름 FROM 학생 ORDER BY 이름;', '글자도 정렬돼요 (가나다 순).'),
    H('상위 N개만: LIMIT'),
    P('"1등만", "상위 3명만"처럼 개수를 제한할 때는 <code>LIMIT</code>를 써요. <b>ORDER BY 와 같이</b> 써야 의미가 있어요.'),
    TRY('SELECT 이름, 점수 FROM 학생 ORDER BY 점수 DESC LIMIT 3;', '점수 상위 3명'),
    TRY('SELECT 이름, 점수 FROM 학생 ORDER BY 점수 DESC LIMIT 2 OFFSET 2;', 'OFFSET 2 → 앞의 2개를 건너뛰고 그다음 2개 (3등, 4등)'),
    TIP('<b>DB마다 문법이 달라요.</b> LIMIT은 MySQL·SQLite·PostgreSQL 방식이에요. Oracle에서는 <code>WHERE ROWNUM &lt;= 3</code> 또는 <code>FETCH FIRST 3 ROWS ONLY</code>, SQL Server에서는 <code>SELECT TOP 3 …</code>를 써요. 시험에서는 "1등 한 명"을 <code>ORDER BY … DESC LIMIT 1</code>로 자주 물어봐요.'),
    QUIZ('SELECT 이름 FROM 학생 ORDER BY 점수 DESC LIMIT 3;', ['수빈, 지민, 예은', '도윤, 서준, 민수', '수빈, 지민, 민수'], '점수 내림차순은 수빈(95) → 지민(91) → 예은(88) → 민수(82)… 위에서 3개는 수빈, 지민, 예은이에요.'),
    QUIZ('SELECT 이름 FROM 학생 ORDER BY 점수 LIMIT 1;', ['수빈', '도윤', '민수'], 'ASC(기본)이라 점수가 가장 낮은 학생이 맨 위에 와요. 70점 도윤이에요. "최고점"을 구하려면 DESC가 필요해요!'),
    MISSION('m4-1', '학생의 이름과 점수를 <b>점수가 높은 순서</b>로 조회하세요.', 'SELECT 이름, 점수 FROM 학생 ORDER BY 점수 DESC', ['높은 순 = 내림차순 = DESC'], { ordered: true }),
    MISSION('m4-2', '<b>점수가 가장 높은 학생 1명</b>의 이름을 조회하세요.', 'SELECT 이름 FROM 학생 ORDER BY 점수 DESC LIMIT 1', ['높은 순으로 정렬하고 1개만 가져오기', 'ORDER BY 점수 DESC LIMIT 1'], { ordered: true }),
    MISSION('m4-3', 'IT 학과 학생의 이름과 점수를 <b>점수 낮은 순</b>으로 조회하세요.', "SELECT 이름, 점수 FROM 학생 WHERE 학과 = 'IT' ORDER BY 점수", ['WHERE 다음에 ORDER BY 가 와요 (순서가 중요!)', '낮은 순은 ASC, 생략해도 돼요.'], { ordered: true })
  ] });

LESSONS.push({ id: 'L5', title: '합계·평균·그룹별로 묶기', min: 14, data: 'school',
  goal: '집계함수(COUNT·SUM·AVG·MAX·MIN)와 GROUP BY·HAVING을 쓰고, SELECT 문의 실행 순서를 설명할 수 있다.',
  blocks: [
    P('여러 행을 <b>하나의 값으로 요약</b>하는 함수를 <b>집계함수</b>라고 해요. 결과는 (그룹당) 1행이 돼요.'),
    { t: 'terms', items: [['COUNT(*)', '행의 개수 (NULL이 있어도 센다)'], ['COUNT(열)', 'NULL이 <b>아닌</b> 값의 개수'], ['SUM(열) / AVG(열)', '합계 / 평균 (NULL은 무시)'], ['MAX(열) / MIN(열)', '최댓값 / 최솟값']] },
    TRY('SELECT COUNT(*) FROM 학생;', '학생이 몇 명? 6'),
    TRY('SELECT SUM(점수), AVG(점수), MAX(점수), MIN(점수) FROM 학생;'),
    TRY("SELECT COUNT(*), AVG(점수) FROM 학생 WHERE 학과 = 'IT';", 'WHERE가 먼저 적용된 뒤에 집계해요. IT 학생 3명의 평균!'),
    TRY('SELECT COUNT(학과), COUNT(DISTINCT 학과) FROM 학생;', 'COUNT(DISTINCT 열)은 "종류의 수". 학과는 3종류!'),
    WARN('집계함수는 <b>WHERE 안에 쓸 수 없어요</b>. <code>WHERE AVG(점수) >= 80</code> → 오류! (아래 HAVING에서 해결)'),
    TRY('SELECT 이름 FROM 학생 WHERE AVG(점수) >= 80;', '일부러 틀린 예. 어떤 오류가 나는지 읽어 보세요.'),
    H('1. 그룹별로 묶기: GROUP BY'),
    P('"학과별 평균", "분류별 개수"처럼 <b>묶음마다</b> 계산하고 싶을 때 <code>GROUP BY 열</code>을 써요. 같은 값을 가진 행끼리 한 묶음이 되고, 집계함수는 묶음마다 계산돼요.'),
    TRY('SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과;', '학과별 학생 수'),
    TRY('SELECT 학과, AVG(점수) AS 평균 FROM 학생 GROUP BY 학과;', '학과별 평균 점수'),
    WARN('GROUP BY를 쓰면 SELECT에는 <b>그룹 기준 열</b>과 <b>집계함수</b>만 쓸 수 있어요. <code>SELECT 이름, 학과, COUNT(*) … GROUP BY 학과</code>는 이름을 어느 학생 것으로 보여줄지 알 수 없어서 안 돼요.'),
    H('2. 그룹에 조건 걸기: HAVING'),
    P('<b>WHERE</b>는 그룹으로 묶기 <b>전에 행</b>을 거르고, <b>HAVING</b>은 묶은 <b>후에 그룹</b>을 걸러요. 집계함수 조건은 HAVING에만 쓸 수 있어요.'),
    TRY('SELECT 학과, AVG(점수) FROM 학생 GROUP BY 학과 HAVING AVG(점수) >= 80;', '평균 80 이상인 학과만'),
    TRY('SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과 HAVING COUNT(*) >= 2;', '학생이 2명 이상인 학과만'),
    H('3. 실행 순서를 눈으로 보기 👀'),
    P('SQL은 <b>쓰는 순서</b>와 <b>실행되는 순서</b>가 달라요. <code>FROM → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</code>. 아래 장치에서 쿼리를 바꿔 가며 [다음 단계]를 눌러 보세요. 연한 행은 그 단계에서 걸러진 행이에요.'),
    { t: 'steps', sql: "SELECT 학과, AVG(점수) AS 평균\nFROM 학생\nWHERE 점수 >= 75\nGROUP BY 학과\nHAVING AVG(점수) >= 85\nORDER BY 평균 DESC" },
    TIP('그래서 <code>WHERE 점수 >= 75</code>가 HAVING보다 먼저 적용되고, SELECT의 별칭(평균)은 HAVING에서 못 쓰는 경우가 많아요. 별칭은 SELECT 이후에야 생기니까요. (ORDER BY에서는 쓸 수 있어요.)'),
    QUIZ('SELECT COUNT(*), MIN(점수) FROM 학생;', ['6 70', '6 95', '5 70'], '학생은 6명이고 가장 낮은 점수는 도윤의 70이에요.'),
    QUIZ('SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과 ORDER BY COUNT(*) DESC LIMIT 1;', ['IT 3', '게임 2', 'IT 6'], '학과별 인원은 IT 3, 게임 2, 디자인 1. 가장 많은 학과 한 줄이 나와요.'),
    QUIZ('SELECT 학과 FROM 학생 GROUP BY 학과 HAVING AVG(점수) >= 85;', ['게임', 'IT, 게임', 'IT'], 'IT 평균은 (82+76+95)/3 ≈ 84.3, 게임은 (91+88)/2 = 89.5, 디자인은 70. 85 이상은 게임뿐이에요.'),
    MISSION('m5-1', '학생이 <b>모두 몇 명</b>인지 조회하세요.', 'SELECT COUNT(*) FROM 학생', ['행의 개수를 세는 함수 COUNT']),
    MISSION('m5-2', '<b>학과별 학생 수</b>를 학과와 함께 조회하세요. (열 2개)', 'SELECT 학과, COUNT(*) FROM 학생 GROUP BY 학과', ['묶는 기준 열이 학과예요.', 'GROUP BY 학과']),
    MISSION('m5-3', '<b>게임학과</b> 학생들의 <b>최고 점수와 평균 점수</b>를 조회하세요.', "SELECT MAX(점수), AVG(점수) FROM 학생 WHERE 학과 = '게임'", ['WHERE로 먼저 게임 학생만 남겨요.']),
    MISSION('m5-4', '<b>평균 점수가 80점 이상인 학과</b>의 이름만 조회하세요.', 'SELECT 학과 FROM 학생 GROUP BY 학과 HAVING AVG(점수) >= 80', ['그룹에 거는 조건은 WHERE가 아니라…?', 'GROUP BY 학과 HAVING AVG(점수) >= 80']),
    MISSION('m5-5', '학과별 <b>최고 점수</b>를 <b>최고</b>라는 제목으로, 높은 순서로 조회하세요. (학과, 최고)', 'SELECT 학과, MAX(점수) AS 최고 FROM 학생 GROUP BY 학과 ORDER BY 최고 DESC', ['ORDER BY에서는 별칭을 쓸 수 있어요.'], { ordered: true })
  ] });

var QS = function (q, options, ans, why) { return { t: 'quiz', kind: 'static', q: q, options: options, ans: ans, why: why }; };

LESSONS.push({ id: 'L6', title: '데이터 넣고·고치고·지우기', min: 10, data: 'school',
  goal: 'INSERT·UPDATE·DELETE로 데이터를 바꾸고, WHERE를 빠뜨렸을 때의 위험을 설명할 수 있다.',
  blocks: [
    P('이제 데이터를 <b>실제로 바꾸는</b> DML을 배워요. 실행하면 결과 표에서 <b style="color:var(--good)">초록 = 새로 추가된 행</b>, <b style="color:var(--warn)">노랑 = 값이 바뀐 행</b>, <b style="color:var(--bad)">빨강 취소선 = 삭제된 행</b>으로 표시해 줘요. 망쳐도 괜찮아요! DB 패널의 <b>↺ 처음 상태로</b>를 누르면 원래대로 돌아와요.'),
    H('1. INSERT — 행 추가'),
    SYN('INSERT INTO 표 VALUES (값1, 값2, …);\nINSERT INTO 표 (열1, 열2) VALUES (값1, 값2);'),
    P('<b>열 이름을 생략</b>하면 표의 <b>모든 열을 순서대로</b> 값을 넣어야 해요. 일부 열만 넣으려면 열 이름을 적어요. 안 넣은 열은 <b>NULL</b>(또는 DEFAULT)이 돼요.'),
    TRY("INSERT INTO 학생 VALUES (107, '하늘', '보안', 85);", '전체 열 입력. 초록색 새 행을 찾아보세요.'),
    TRY("INSERT INTO 학생 (학번, 이름) VALUES (108, '라온');", '일부 열만 입력 → 학과, 점수는 NULL'),
    TRY("INSERT INTO 학생 VALUES (109, '새봄', 'IT', 79), (110, '다온', '게임', 93);", '여러 행을 한 번에: VALUES 뒤에 괄호 묶음을 쉼표로 이어요.'),
    TRY("INSERT INTO 학생 VALUES (101, '중복', 'IT', 50);", '이미 있는 학번 101 → 기본키 중복 오류! (8단원에서 자세히)'),
    H('2. UPDATE — 값 수정'),
    SYN('UPDATE 표 SET 열 = 새값 [, 열2 = 새값2] <b>WHERE 조건</b>;'),
    TRY("UPDATE 학생 SET 점수 = 100 WHERE 이름 = '민수';", '노란색으로 바뀐 한 행을 확인하세요.'),
    TRY("UPDATE 학생 SET 점수 = 점수 + 5 WHERE 학과 = 'IT';", '기존 값을 이용한 계산도 가능해요. IT 학생 모두 +5점.'),
    WARN('<b>WHERE를 빠뜨리면 모든 행이 바뀌어요!</b> 아래를 실행해서 얼마나 무서운지 직접 보세요. (↺ 처음 상태로 복구할 수 있어요)'),
    TRY('UPDATE 학생 SET 점수 = 0;', 'WHERE가 없다 → 전원 0점! 실제 DB에서 이러면 큰일이에요.'),
    H('3. DELETE — 행 삭제'),
    SYN('DELETE FROM 표 <b>WHERE 조건</b>;'),
    TRY("DELETE FROM 학생 WHERE 이름 = '도윤';", '빨간 줄이 사라지는 행이에요.'),
    TRY('DELETE FROM 학생 WHERE 점수 < 80;', '조건에 맞는 여러 행 삭제'),
    WARN('<code>DELETE FROM 학생;</code> (WHERE 없음) = <b>모든 행 삭제</b>. 표의 구조는 남지만 데이터가 전부 사라져요. 실행 전에 같은 WHERE로 <b>SELECT를 먼저</b> 해서 대상 행을 확인하는 습관이 안전해요.'),
    TIP('<b>안전한 습관:</b> ① SELECT * FROM 표 WHERE 조건 으로 대상 확인 → ② 같은 조건으로 UPDATE/DELETE 실행 → ③ SELECT로 결과 확인.'),
    QUIZ("UPDATE 학생 SET 점수 = 점수 + 10 WHERE 학과 = '게임';\nSELECT 이름, 점수 FROM 학생 WHERE 학과 = '게임';", ['지민 101 / 예은 98', '지민 91 / 예은 88', '지민 101 / 예은 88'], '게임학과 학생(지민 91, 예은 88) 모두 10점이 올라 101, 98이 돼요. 여러 문장을 한 번에 실행하면 마지막 SELECT의 결과가 보여요.'),
    QUIZ("DELETE FROM 학생 WHERE 학과 = 'IT';\nSELECT COUNT(*) FROM 학생;", ['3', '6', '0'], 'IT 학생 3명이 삭제되고 6 − 3 = 3명이 남아요.'),
    QUIZ("INSERT INTO 학생 (학번, 이름) VALUES (107, '하늘');\nSELECT 이름, 학과, 점수 FROM 학생 WHERE 학번 = 107;", ['하늘 NULL NULL', '하늘 0 0', '(결과 없음)'], '이름과 학번만 넣었으니 나머지 열은 NULL이에요. (DEFAULT가 따로 없을 때)'),
    QS('다음 중 WHERE 없이 실행하면 <b>모든 행</b>에 영향을 주는 SQL이 <b>아닌</b> 것은?', ['UPDATE 학생 SET 점수 = 0;', 'DELETE FROM 학생;', "INSERT INTO 학생 VALUES (1,'a','b',1);", 'SELECT * FROM 학생;'], 2, 'INSERT는 새 행을 한 개 더하는 명령이고 기존 행에는 영향이 없어요. (SELECT는 영향을 주진 않지만 모든 행을 "보여주긴" 해요.) UPDATE와 DELETE는 WHERE가 없으면 전부에 적용돼요.'),
    MISSION('m6-1', "학번 <b>107</b>, 이름 <b>하늘</b>, 학과 <b>보안</b>, 점수 <b>85</b>인 학생을 추가하세요.", "INSERT INTO 학생 VALUES (107, '하늘', '보안', 85)", ['INSERT INTO 표 VALUES (값, 값, 값, 값)', "글자는 작은따옴표: '하늘'"]),
    MISSION('m6-2', '<b>도윤</b>의 점수를 <b>80</b>점으로 수정하세요.', "UPDATE 학생 SET 점수 = 80 WHERE 이름 = '도윤'", ['UPDATE 표 SET 열 = 값 WHERE 조건', 'WHERE를 꼭 쓰세요! 안 쓰면 모두 바뀌어서 오답이에요.']),
    MISSION('m6-3', '<b>디자인</b>학과 학생을 모두 삭제하세요.', "DELETE FROM 학생 WHERE 학과 = '디자인'", ['DELETE FROM 표 WHERE 조건']),
    MISSION('m6-4', '<b>점수가 90점 미만</b>인 학생들의 점수를 <b>5점씩 올리세요.</b>', 'UPDATE 학생 SET 점수 = 점수 + 5 WHERE 점수 < 90', ['SET 점수 = 점수 + 5', '대상은 점수 < 90 인 행만'])
  ] });

LESSONS.push({ id: 'L7', title: '표 만들고 구조 바꾸기 (DDL)', min: 9, data: 'empty',
  goal: 'CREATE·ALTER·DROP·TRUNCATE로 표의 구조를 다루고, DELETE·TRUNCATE·DROP의 차이를 설명할 수 있다.',
  blocks: [
    P('DDL(데이터 정의어)은 <b>표 자체의 구조</b>를 만들고 바꾸고 지워요. 지금 DB는 <b>텅 비어</b> 있어요. 아래 예제를 <b>위에서부터 차례로</b> 실행하면서 DB 패널에 표가 생기고 변하는 걸 보세요.'),
    H('1. CREATE TABLE — 표 만들기'),
    SYN('CREATE TABLE 표이름 (\n  열이름1 자료형 [제약조건],\n  열이름2 자료형,\n  …\n);'),
    { t: 'terms', items: [['INT', '정수'], ['VARCHAR(n)', '최대 n글자의 가변 길이 문자열 (Oracle은 VARCHAR2)'], ['CHAR(n)', '항상 n글자로 채워지는 고정 길이 문자열'], ['DATE', '날짜'], ['DECIMAL(p,s) / FLOAT', '소수점이 있는 수']] },
    TRY("CREATE TABLE 도서 (\n  번호 INT PRIMARY KEY,\n  제목 VARCHAR(30) NOT NULL,\n  가격 INT\n);", '오른쪽 DB 패널에 도서 표가 생겼어요. 🔑는 기본키!'),
    TRY("INSERT INTO 도서 VALUES (1, '자바 입문', 20000), (2, 'SQL 기초', 18000);\nSELECT * FROM 도서;", '새 표에 데이터를 넣어 봐요.'),
    H('2. ALTER TABLE — 구조 바꾸기'),
    SYN('ALTER TABLE 표 ADD 열 자료형;          -- 열 추가\nALTER TABLE 표 MODIFY 열 새자료형;     -- 열 정의 변경\nALTER TABLE 표 DROP COLUMN 열;         -- 열 삭제\nALTER TABLE 표 RENAME COLUMN 옛 TO 새;  -- 열 이름 변경'),
    TRY('ALTER TABLE 도서 ADD 저자 VARCHAR(20);', '새 열이 생기고, 기존 행의 저자는 NULL이에요.'),
    TRY('ALTER TABLE 도서 MODIFY 제목 VARCHAR(50);', '제목을 더 길게 저장할 수 있게 변경'),
    TRY('ALTER TABLE 도서 RENAME COLUMN 저자 TO 지은이;'),
    TRY('ALTER TABLE 도서 DROP COLUMN 지은이;', '열을 지우면 그 열의 데이터도 함께 사라져요.'),
    WARN('시험에서 <b>"CREATE COLUMN"이나 "ALTER TABLE … ADD COLUMN을 CREATE로"</b> 같은 틀린 보기가 나와요. 표를 <b>만들 때</b>는 CREATE, 이미 있는 표에 열을 <b>더할 때</b>는 ALTER예요. (CREATE는 TABLE, VIEW, INDEX 같은 <b>객체</b>를 만들 때만 써요.)'),
    H('3. 비우기와 없애기 — DELETE · TRUNCATE · DROP'),
    { t: 'cmp', head: ['', 'DELETE FROM 표', 'TRUNCATE TABLE 표', 'DROP TABLE 표'], rows: [['분류', 'DML', 'DDL', 'DDL'], ['지우는 것', '행 (WHERE로 일부만 가능)', '모든 행 (WHERE 불가)', '표 전체 (구조+데이터)'], ['표 구조', '남음', '남음', '<b>사라짐</b>'], ['되돌리기(ROLLBACK)', '가능', '불가 (DDL은 자동 확정)', '불가']] },
    TRY('DELETE FROM 도서 WHERE 번호 = 2;\nSELECT * FROM 도서;', 'DELETE는 조건을 줄 수 있어요.'),
    TRY('TRUNCATE TABLE 도서;\nSELECT * FROM 도서;', '모든 행이 사라졌지만 표(열 구조)는 남아 있어요. 오류 없이 빈 결과!'),
    TRY('DROP TABLE 도서;\nSELECT * FROM 도서;', '표 자체가 사라져서 두 번째 문장에서 "no such table" 오류가 나요.'),
    QS('표의 <b>구조는 남기고 모든 데이터만</b> 빠르게 지우는 명령은?', ['DROP TABLE', 'TRUNCATE TABLE', 'ALTER TABLE', 'CREATE TABLE'], 1, 'TRUNCATE는 구조를 남기고 모든 행을 지워요. DROP은 구조까지 모두 삭제해요.'),
    QS('이미 만들어진 표에 새 열을 추가하는 명령은?', ['CREATE COLUMN', 'UPDATE TABLE', 'ALTER TABLE … ADD', 'INSERT COLUMN'], 2, '표의 구조를 바꾸는 명령은 ALTER TABLE이에요. 열 추가는 ADD, 삭제는 DROP COLUMN, 변경은 MODIFY.'),
    MISSION('m7-1', "<b>상품</b> 표를 만드세요. 열: <b>코드</b>(INT, 기본키), <b>이름</b>(VARCHAR(20)), <b>가격</b>(INT)", 'CREATE TABLE 상품 (코드 INT PRIMARY KEY, 이름 VARCHAR(20), 가격 INT)', ['CREATE TABLE 상품 ( 열 자료형, 열 자료형, … );', '기본키는 열 정의 끝에 PRIMARY KEY']),
    MISSION('m7-2', '위 표를 만들고, 이어서 <b>재고</b>(INT) 열을 추가하세요. (한 번에 두 문장 실행)', 'CREATE TABLE 상품 (코드 INT PRIMARY KEY, 이름 VARCHAR(20), 가격 INT); ALTER TABLE 상품 ADD 재고 INT;', ['문장은 세미콜론(;)으로 구분해서 이어 쓸 수 있어요.', 'ALTER TABLE 상품 ADD 재고 INT;']),
    MISSION('m7-3', '<b>학생</b> 표가 이미 있어요. 이 표의 <b>모든 데이터를 지우되 표 구조는 남기세요.</b> (DELETE도, TRUNCATE도 가능하지만 이번엔 TRUNCATE로!)', 'TRUNCATE TABLE 학생', ['표 구조는 남기고 비운다 → TRUNCATE'], { data: 'school' }),
    MISSION('m7-4', '<b>수강</b> 표를 <b>완전히 삭제</b>하세요. (표 구조까지)', 'DROP TABLE 수강', ['구조까지 삭제 → DROP TABLE'], { data: 'school' })
  ] });

LESSONS.push({ id: 'L8', title: '규칙으로 데이터 지키기 — 제약조건', min: 10, data: 'empty',
  goal: 'PRIMARY KEY·NOT NULL·UNIQUE·CHECK·DEFAULT·FOREIGN KEY의 역할을 구분하고 오류를 읽을 수 있다.',
  blocks: [
    P('<b>제약조건</b>은 표에 "이런 값만 들어올 수 있어"라는 <b>규칙</b>을 거는 거예요. 규칙을 어기는 INSERT/UPDATE는 <b>오류</b>가 나고 데이터는 바뀌지 않아요. 이 단원에서는 오류 메시지를 읽는 연습을 많이 해요.'),
    { t: 'terms', items: [['PRIMARY KEY (기본키)', '행을 구분하는 열. <b>중복 불가 + NULL 불가</b>. 표에 하나만.'], ['NOT NULL', '비워 둘 수 없음 (NULL 불가). 중복은 가능.'], ['UNIQUE', '<b>중복 불가</b>. 단, NULL은 허용돼요.'], ['CHECK (조건)', '조건을 만족하는 값만 허용. 예: CHECK (점수 BETWEEN 0 AND 100)'], ['DEFAULT 값', '값을 안 넣으면 자동으로 들어갈 기본값'], ['FOREIGN KEY (외래키)', '다른 표의 기본키를 참조. <b>참조되는 값이 있어야</b> 넣을 수 있음']] },
    H('1. 규칙이 가득한 표 만들기'),
    P('먼저 부모가 되는 <b>학과</b> 표를 만들고, 그것을 참조하는 <b>학생</b> 표를 만들어요. (참조당하는 표를 먼저 만들어야 해요!)'),
    TRY("CREATE TABLE 학과 (\n  학과명 VARCHAR(10) PRIMARY KEY,\n  위치 VARCHAR(10)\n);\nINSERT INTO 학과 VALUES ('IT','서울'), ('게임','부산');"),
    TRY("CREATE TABLE 학생 (\n  학번 INT PRIMARY KEY,\n  이름 VARCHAR(10) NOT NULL,\n  이메일 VARCHAR(30) UNIQUE,\n  점수 INT DEFAULT 0 CHECK (점수 BETWEEN 0 AND 100),\n  학과 VARCHAR(10),\n  FOREIGN KEY (학과) REFERENCES 학과(학과명)\n);", 'DB 패널에서 🔑 PK, NN(NOT NULL), UQ, FK 배지를 확인하세요.'),
    TRY("INSERT INTO 학생 (학번, 이름, 이메일, 학과) VALUES (1, '민수', 'a@x.kr', 'IT');\nSELECT * FROM 학생;", '성공! 점수는 안 넣었더니 DEFAULT 0이 들어갔어요.'),
    H('2. 일부러 규칙 어겨 보기'),
    TRY("INSERT INTO 학생 (학번, 이름, 학과) VALUES (1, '지민', 'IT');", '❌ 기본키 중복: 학번 1이 이미 있어요.'),
    TRY("INSERT INTO 학생 (학번, 학과) VALUES (2, 'IT');", '❌ NOT NULL: 이름을 비울 수 없어요.'),
    TRY("INSERT INTO 학생 (학번, 이름, 이메일) VALUES (3, '서준', 'a@x.kr');", '❌ UNIQUE: 이메일 a@x.kr이 이미 있어요.'),
    TRY("INSERT INTO 학생 (학번, 이름, 점수) VALUES (4, '수빈', 150);", '❌ CHECK: 점수는 0~100만 가능해요.'),
    TRY("INSERT INTO 학생 (학번, 이름, 학과) VALUES (5, '예은', '보안');", '❌ FOREIGN KEY: 학과 표에 \'보안\'이 없어요.'),
    TRY("INSERT INTO 학생 (학번, 이름, 이메일) VALUES (6, '도윤', NULL), (7, '새봄', NULL);\nSELECT 학번, 이름, 이메일 FROM 학생;", '✅ UNIQUE 열이라도 NULL은 여러 개 넣을 수 있어요! (NULL은 "값이 없음"이라 서로 같다고 보지 않아요)'),
    H('3. 부모 행을 지우려 하면?'),
    TRY("DELETE FROM 학과 WHERE 학과명 = 'IT';", '❌ 민수가 IT를 참조하고 있어서 지울 수 없어요. (참조 무결성)'),
    TRY("UPDATE 학생 SET 학과 = NULL WHERE 학번 = 1;\nDELETE FROM 학과 WHERE 학과명 = 'IT';\nSELECT * FROM 학과;", '참조하던 행의 학과를 NULL로 바꾸면(참조 해제) 이제 지울 수 있어요.'),
    TIP('<b>제약조건 한눈에 비교</b><br>· PRIMARY KEY = UNIQUE + NOT NULL (표에 1개)<br>· UNIQUE = 중복 불가, NULL 허용 (여러 개 가능)<br>· NOT NULL = NULL 불가, 중복 허용<br>· FOREIGN KEY = 다른 표의 값만 허용 (<b>참조 무결성</b>)'),
    QS('값이 <b>중복되지 않고</b> NULL도 허용하지 않도록 하려면?', ['UNIQUE', 'NOT NULL', 'PRIMARY KEY', 'CHECK'], 2, 'PRIMARY KEY는 UNIQUE + NOT NULL이에요. UNIQUE만으로는 NULL이 들어갈 수 있고, NOT NULL만으로는 중복이 가능해요.'),
    QS('다른 표의 기본키를 참조하여 <b>참조 무결성</b>을 지키게 하는 제약조건은?', ['PRIMARY KEY', 'FOREIGN KEY', 'DEFAULT', 'UNIQUE'], 1, '외래키(FOREIGN KEY)는 참조되는 표에 존재하는 값만 허용해서 참조 무결성을 보장해요.'),
    QS('<code>점수 INT CHECK (점수 BETWEEN 0 AND 100)</code> 열에 <code>INSERT … VALUES (101)</code> 을 하면?', ['101이 저장된다', '오류가 나고 저장되지 않는다', '100으로 자동 변경된다', 'NULL이 저장된다'], 1, 'CHECK 조건을 어기면 오류가 나고 행이 저장되지 않아요. 값을 자동으로 고쳐 주지는 않아요.'),
    MISSION('m8-1', "<b>회원</b> 표를 만드세요. <b>아이디</b> VARCHAR(10) <b>기본키</b>, <b>이름</b> VARCHAR(10) <b>NOT NULL</b>, <b>나이</b> INT", 'CREATE TABLE 회원 (아이디 VARCHAR(10) PRIMARY KEY, 이름 VARCHAR(10) NOT NULL, 나이 INT)', ['열 정의 뒤에 제약조건을 이어서 써요.', '아이디 VARCHAR(10) PRIMARY KEY, 이름 VARCHAR(10) NOT NULL, 나이 INT']),
    MISSION('m8-2', "<b>메뉴</b> 표를 만드세요. <b>번호</b> INT 기본키, <b>이름</b> VARCHAR(20) UNIQUE, <b>가격</b> INT <b>CHECK (가격 >= 0)</b>, <b>판매중</b> INT <b>DEFAULT 1</b>", 'CREATE TABLE 메뉴 (번호 INT PRIMARY KEY, 이름 VARCHAR(20) UNIQUE, 가격 INT CHECK (가격 >= 0), 판매중 INT DEFAULT 1)', ['열마다 제약조건을 붙일 수 있어요.', '가격 INT CHECK (가격 >= 0), 판매중 INT DEFAULT 1']),
    MISSION('m8-3', "<b>부서</b>와 <b>직원</b> 표를 만들어요. 부서(<b>부서명</b> VARCHAR(10) 기본키), 직원(<b>사번</b> INT 기본키, <b>부서명</b> VARCHAR(10) → <b>부서의 부서명을 참조하는 외래키</b>). 부서를 먼저 만드세요.", 'CREATE TABLE 부서 (부서명 VARCHAR(10) PRIMARY KEY); CREATE TABLE 직원 (사번 INT PRIMARY KEY, 부서명 VARCHAR(10), FOREIGN KEY (부서명) REFERENCES 부서(부서명));', ['FOREIGN KEY (열) REFERENCES 부모표(부모열)', '부모 표를 먼저 만들어야 해요!'])
  ] });

LESSONS.push({ id: 'L9', title: '표와 표를 이어 붙이기 — JOIN', min: 12, data: 'school_join',
  goal: 'INNER·LEFT·RIGHT·FULL JOIN의 차이를 설명하고, JOIN으로 두 표를 연결해 조회할 수 있다.',
  blocks: [
    P('<b>학생</b> 표에는 학생 정보가, <b>수강</b> 표에는 (학번, 과목)이 따로 있어요. "민수가 어떤 과목을 듣나?"를 알려면 두 표를 <b>같은 값(학번)으로 이어야</b> 해요. 이게 <b>JOIN</b>이에요. 왜 표를 나눌까요? 학생 정보를 과목마다 반복해서 저장하면 낭비이고, 이름을 바꿀 때 여러 군데를 고쳐야 하니까요.'),
    P('이 단원의 수강 표에는 일부러 <b>107번</b>이 있어요. 학생 표에는 없는 학번이에요. (오른쪽 DB 패널에서 확인!) 이런 "짝이 없는 행"이 JOIN 종류마다 어떻게 다루어지는지가 핵심이에요.'),
    H('1. 교차 조인 — 일단 다 짝지어 보기'),
    TRY('SELECT COUNT(*) FROM 학생, 수강;', '조건 없이 두 표를 쓰면 모든 행의 조합! 6 × 6 = 36개. 이게 <b>교차 조인(CROSS JOIN)</b>이에요. 의미 없는 조합이 많죠?'),
    H('2. INNER JOIN — 짝이 있는 것만'),
    SYN('SELECT … FROM 표A <b>[INNER] JOIN</b> 표B <b>ON</b> 표A.열 = 표B.열;'),
    P('<code>ON</code> 뒤에 "어떤 열이 같으면 짝으로 볼지"를 써요. 두 표에 같은 이름의 열(학번)이 있으면 <b>표이름.열이름</b>으로 구분해야 해요.'),
    TRY('SELECT 학생.이름, 수강.과목\nFROM 학생\nINNER JOIN 수강 ON 학생.학번 = 수강.학번;', '짝이 있는 5개 행만 나와요. 도윤·서준(수강 없음)과 107번(학생 없음)은 빠져요.'),
    P('표 이름이 길면 <b>별칭</b>을 붙여 줄여 써요: <code>학생 S</code>, <code>수강 C</code>'),
    TRY('SELECT S.이름, C.과목\nFROM 학생 S\nJOIN 수강 C ON S.학번 = C.학번\nWHERE C.과목 = \'자바\';', 'JOIN 뒤에 WHERE로 한 번 더 걸러도 돼요. (JOIN만 쓰면 INNER JOIN)'),
    H('3. LEFT / RIGHT / FULL — 짝 없는 행도 살리기'),
    { t: 'cmp', head: ['종류', '결과에 포함되는 행'], rows: [['INNER JOIN', '양쪽에 짝이 있는 행만'], ['LEFT [OUTER] JOIN', '<b>왼쪽 표는 전부</b> + 짝 있으면 붙이고, 없으면 NULL'], ['RIGHT [OUTER] JOIN', '<b>오른쪽 표는 전부</b> + 짝 없으면 왼쪽이 NULL'], ['FULL [OUTER] JOIN', '양쪽 전부 (짝 없으면 반대쪽 NULL)']] },
    P('아래 시각화 장치로 JOIN 종류를 바꿔 보세요. 결과의 한 행에 <b>마우스를 올리면</b>(터치는 탭) 그 행이 어느 원본 행에서 왔는지 양쪽 표에서 하이라이트돼요. NULL은 <span style="background:var(--warn-bg);padding:0 4px;border-radius:4px">노란 칸</span>으로 표시돼요.'),
    { t: 'joinviz' },
    H('4. LEFT JOIN 활용: "없는 것 찾기"'),
    TRY('SELECT 학생.이름, 수강.과목\nFROM 학생\nLEFT JOIN 수강 ON 학생.학번 = 수강.학번;', '서준·도윤은 과목이 NULL로 나와요.'),
    TRY('SELECT 학생.이름\nFROM 학생\nLEFT JOIN 수강 ON 학생.학번 = 수강.학번\nWHERE 수강.학번 IS NULL;', '<b>수강을 하나도 안 한 학생</b> = 짝이 없어서 NULL이 된 행만 골라내기! 시험에 자주 나와요.'),
    TRY('SELECT 학생.이름, COUNT(수강.과목) AS 과목수\nFROM 학생\nLEFT JOIN 수강 ON 학생.학번 = 수강.학번\nGROUP BY 학생.이름;', 'COUNT(수강.과목)은 NULL을 세지 않아서, 수강이 없는 학생이 0으로 나와요. (COUNT(*)였다면 1이 돼요!)'),
    WARN('<b>ON과 WHERE는 달라요.</b> INNER JOIN에서는 같은 결과지만, LEFT JOIN에서 WHERE로 오른쪽 표를 걸러 버리면 NULL 행이 사라져서 사실상 INNER JOIN이 돼 버려요.'),
    QUIZ('SELECT COUNT(*) FROM 학생, 수강;', ['36', '11', '6'], '학생 6행 × 수강 6행 = 36개의 조합이에요. 조건 없이 이으면 모든 경우의 수가 나와요.'),
    QUIZ('SELECT 학생.이름, 수강.과목 FROM 학생 JOIN 수강 ON 학생.학번 = 수강.학번 WHERE 수강.과목 = \'SQL\';', ['민수 SQL / 수빈 SQL', '민수 SQL / 수빈 SQL / 서준 NULL', '민수 자바 / 민수 SQL / 수빈 SQL'], 'SQL 과목을 듣는 사람은 민수(101)와 수빈(104)이에요.'),
    QUIZ('SELECT 학생.이름 FROM 학생 LEFT JOIN 수강 ON 학생.학번 = 수강.학번 WHERE 수강.학번 IS NULL;', ['서준, 도윤', '서준, 도윤, 하늘', '민수, 지민, 수빈, 예은'], '수강 기록이 없는 학생은 서준(103), 도윤(106)이에요. 107은 학생 표에 없으니 나오지 않아요.'),
    QS('왼쪽 표의 <b>모든 행</b>을 결과에 포함하고, 오른쪽에 짝이 없으면 NULL로 채우는 JOIN은?', ['INNER JOIN', 'LEFT OUTER JOIN', 'RIGHT OUTER JOIN', 'CROSS JOIN'], 1, 'LEFT (OUTER) JOIN은 왼쪽 표의 행을 모두 보존해요.'),
    MISSION('m9-1', '<b>자바</b>를 수강하는 학생의 <b>이름</b>을 조회하세요. (JOIN 사용)', "SELECT 학생.이름 FROM 학생 JOIN 수강 ON 학생.학번 = 수강.학번 WHERE 수강.과목 = '자바'", ['학생과 수강을 학번으로 이어요.', "ON 학생.학번 = 수강.학번 WHERE 수강.과목 = '자바'"]),
    MISSION('m9-2', '<b>수강을 하나도 안 한 학생</b>의 이름을 LEFT JOIN으로 조회하세요.', 'SELECT 학생.이름 FROM 학생 LEFT JOIN 수강 ON 학생.학번 = 수강.학번 WHERE 수강.학번 IS NULL', ['LEFT JOIN 하면 짝 없는 학생은 수강 쪽이 NULL', 'WHERE 수강.학번 IS NULL']),
    MISSION('m9-3', '학생별로 <b>이름</b>과 <b>수강 과목 수</b>를 조회하세요. 수강이 없는 학생은 0으로 나와야 해요. (이름, 과목수)', 'SELECT 학생.이름, COUNT(수강.과목) FROM 학생 LEFT JOIN 수강 ON 학생.학번 = 수강.학번 GROUP BY 학생.이름', ['모든 학생이 나오려면 LEFT JOIN', 'COUNT(*)가 아니라 COUNT(수강.과목)', 'GROUP BY 학생.이름']),
    MISSION('m9-4', '<b>직원</b> 표와 <b>부서</b> 표를 JOIN해서, 부서 위치가 <b>서울</b>인 직원의 이름을 조회하세요. (직원 E, 부서 D로 별칭 사용 권장)', "SELECT E.이름 FROM 직원 E JOIN 부서 D ON E.부서 = D.부서 WHERE D.위치 = '서울'", ['직원.부서 = 부서.부서 로 이어요.', "WHERE D.위치 = '서울'"], { data: 'emp' })
  ] });

LESSONS.push({ id: 'L10', title: '쿼리 안의 쿼리 — 서브쿼리와 집합', min: 10, data: 'emp',
  goal: '서브쿼리(스칼라·IN·EXISTS)와 UNION·INTERSECT·EXCEPT를 쓸 수 있다.',
  blocks: [
    P('<b>서브쿼리</b>는 괄호 ( ) 안에 쓴 또 다른 SELECT예요. <b>안쪽이 먼저 실행</b>되고, 그 결과를 바깥쪽 쿼리가 사용해요. 이 단원은 <b>직원·부서</b> 표(오른쪽)로 해요.'),
    H('1. 값 하나를 돌려주는 서브쿼리 (스칼라)'),
    P('"평균보다 급여가 높은 직원"은 두 단계예요. ① 평균 구하기 ② 그 값보다 큰 직원 찾기. 서브쿼리로 한 번에 써요.'),
    TRY('SELECT AVG(급여) FROM 직원;', '① 평균을 먼저 확인해요. (403.33…)'),
    TRY('SELECT 이름, 급여\nFROM 직원\nWHERE 급여 > (SELECT AVG(급여) FROM 직원);', '② 서브쿼리가 403.33으로 바뀐 것과 같아요.'),
    H('2. 여러 값을 돌려주는 서브쿼리: IN / NOT IN'),
    TRY("SELECT 이름 FROM 직원\nWHERE 부서 IN (SELECT 부서 FROM 부서 WHERE 위치 IN ('서울','부산'));", '위치가 서울·부산인 부서에 속한 직원'),
    TRY('SELECT 부서 FROM 부서\nWHERE 부서 NOT IN (SELECT 부서 FROM 직원);', '직원이 한 명도 없는 부서 = 기획'),
    WARN('<b>NOT IN의 함정:</b> 서브쿼리 결과에 NULL이 하나라도 있으면 NOT IN은 <b>아무 행도 돌려주지 않아요</b>. 아래를 실행해 보세요.'),
    TRY('SELECT 이름 FROM 직원 WHERE 사번 NOT IN (1, NULL);', '사번이 1이 아닌 직원이 있는데도 결과가 비어요! NULL 때문에 "아님"을 확신할 수 없기 때문이에요.'),
    H('3. EXISTS — "존재하나?"'),
    TRY('SELECT 부서, 위치 FROM 부서 D\nWHERE EXISTS (SELECT 1 FROM 직원 E WHERE E.부서 = D.부서);', '직원이 1명이라도 있는 부서. 안쪽 쿼리가 바깥 행(D)을 참조해요. (상관 서브쿼리)'),
    H('4. FROM 안의 서브쿼리 (인라인 뷰)'),
    TRY('SELECT 부서, 평균\nFROM (SELECT 부서, AVG(급여) AS 평균 FROM 직원 GROUP BY 부서) T\nWHERE 평균 >= 400;', 'FROM 안의 서브쿼리는 "임시 표"처럼 쓰고, 반드시 별칭(T)이 필요해요.'),
    H('5. 집합 연산자 — 두 SELECT의 결과를 합치고 빼기'),
    { t: 'cmp', head: ['연산자', '의미', '중복'], rows: [['UNION', '합집합', '제거'], ['UNION ALL', '합집합', '<b>그대로 둠</b>'], ['INTERSECT', '교집합 (둘 다 있는 것)', '제거'], ['EXCEPT (Oracle은 MINUS)', '차집합 (앞에는 있고 뒤에는 없는 것)', '제거']] },
    P('두 SELECT는 <b>열의 개수와 순서가 같아야</b> 해요.'),
    TRY("SELECT 부서 FROM 직원 WHERE 급여 >= 450\nUNION\nSELECT 부서 FROM 부서 WHERE 위치 IN ('서울', '대구');", '급여 450 이상 직원의 부서(개발, 영업) ∪ 서울·대구 부서(개발, 인사) → 중복 제거'),
    TRY("SELECT 부서 FROM 직원 WHERE 급여 >= 450\nUNION ALL\nSELECT 부서 FROM 부서 WHERE 위치 IN ('서울', '대구');", 'UNION ALL은 중복(개발)이 그대로 남아요.'),
    TRY("SELECT 부서 FROM 직원\nINTERSECT\nSELECT 부서 FROM 부서 WHERE 위치 = '서울';", '직원이 있는 부서 ∩ 서울 부서'),
    TRY('SELECT 부서 FROM 부서\nEXCEPT\nSELECT 부서 FROM 직원;', '모든 부서 − 직원이 있는 부서 = 기획'),
    QUIZ('SELECT 이름 FROM 직원 WHERE 급여 > (SELECT AVG(급여) FROM 직원);', ['박하, 정우, 신아', '한솔, 오늘, 윤서', '박하'], '평균 급여는 (400+300+500+350+450+420)/6 ≈ 403.3이에요. 이보다 높은 직원은 박하(500), 정우(450), 신아(420)예요. 한솔은 400으로 평균 이하!'),
    QUIZ('SELECT 부서 FROM 직원 WHERE 급여 >= 450 UNION SELECT 부서 FROM 부서 WHERE 위치 IN (\'서울\',\'대구\');', ['개발, 영업, 인사', '개발, 영업, 개발, 인사', '개발'], '첫째 결과 {개발, 영업} 둘째 결과 {개발, 인사}의 합집합에서 중복(개발)이 제거돼 개발, 영업, 인사가 나와요. (정렬 순서는 DB마다 다를 수 있어요)'),
    QS('<b>중복을 제거하지 않고</b> 두 SELECT 결과를 합치는 연산자는?', ['UNION', 'UNION ALL', 'INTERSECT', 'EXCEPT'], 1, 'UNION ALL은 중복 제거 과정을 생략해서 모든 행을 그대로 합쳐요. 그래서 UNION보다 빠르기도 해요.'),
    MISSION('m10-1', '<b>평균 급여보다 급여가 높은</b> 직원의 이름을 사번 순으로 조회하세요.', 'SELECT 이름 FROM 직원 WHERE 급여 > (SELECT AVG(급여) FROM 직원) ORDER BY 사번', ['평균은 서브쿼리로 구해요.', 'WHERE 급여 > (SELECT AVG(급여) FROM 직원)'], { ordered: true }),
    MISSION('m10-2', '<b>직원이 한 명도 없는 부서</b>의 이름을 조회하세요. (NOT IN 서브쿼리)', 'SELECT 부서 FROM 부서 WHERE 부서 NOT IN (SELECT 부서 FROM 직원)', ['직원 표에 나타나는 부서 목록을 서브쿼리로.']),
    MISSION('m10-3', '<b>급여가 가장 높은 직원</b>의 이름을 서브쿼리와 MAX를 써서 조회하세요.', 'SELECT 이름 FROM 직원 WHERE 급여 = (SELECT MAX(급여) FROM 직원)', ['최댓값을 서브쿼리로 구해서 같은 급여를 찾아요.']),
    MISSION('m10-4', '부서 표의 부서에서 <b>직원 표의 부서를 뺀</b>(차집합) 결과를 EXCEPT로 조회하세요.', 'SELECT 부서 FROM 부서 EXCEPT SELECT 부서 FROM 직원', ['SELECT … EXCEPT SELECT …'])
  ] });
LESSONS.push({ id: 'L11', title: '뷰와 인덱스', min: 6, data: 'emp',
  goal: '뷰(가상 테이블)와 인덱스(검색 속도 장치)의 목적을 설명하고 만들 수 있다.',
  blocks: [
    H('1. 뷰(VIEW) — 저장해 둔 SELECT'),
    P('자주 쓰는 복잡한 SELECT를 이름 붙여 저장해 두면 <b>표처럼</b> 쓸 수 있어요. 이것이 <b>뷰</b>예요. 뷰는 <b>데이터를 복사해 두는 게 아니라</b> 조회할 때마다 원본 표에서 읽어와요. 그래서 원본이 바뀌면 뷰 결과도 바뀌어요.'),
    SYN('CREATE VIEW 뷰이름 AS SELECT …;\nDROP VIEW 뷰이름;'),
    TRY("CREATE VIEW 개발직원 AS\nSELECT 사번, 이름, 급여 FROM 직원 WHERE 부서 = '개발';", 'DB 패널에 뷰(👁)가 생겼어요.'),
    TRY('SELECT * FROM 개발직원;', '표처럼 조회!'),
    TRY("UPDATE 직원 SET 급여 = 600 WHERE 이름 = '한솔';\nSELECT * FROM 개발직원;", '원본을 바꿨더니 뷰의 결과도 바뀌었어요. 뷰는 "창문"이지 "복사본"이 아니에요.'),
    TIP('<b>뷰를 쓰는 이유</b> ① 복잡한 쿼리를 단순하게 ② <b>보안</b>(일부 열·행만 보여주기: 급여 열은 숨기고 이름만 공개) ③ 같은 논리를 여러 곳에서 재사용. DROP VIEW로 뷰를 지워도 <b>원본 데이터는 그대로</b>예요.'),
    TRY('DROP VIEW 개발직원;\nSELECT COUNT(*) FROM 직원;', '뷰를 지워도 직원 표의 6명은 그대로!'),
    H('2. 인덱스(INDEX) — 책의 "찾아보기"'),
    P('책 한 권에서 단어를 찾을 때 처음부터 다 읽지 않고 <b>찾아보기</b>를 이용하죠? 인덱스는 DB의 찾아보기예요. 자주 검색하는 열에 만들어 두면 <b>WHERE 검색이 빨라져요</b>. 결과는 똑같고 <b>속도만</b> 달라져요. 대신 INSERT/UPDATE/DELETE는 조금 느려지고 저장 공간을 더 써요.'),
    SYN('CREATE INDEX 인덱스이름 ON 표(열);\nDROP INDEX 인덱스이름;'),
    TRY('CREATE INDEX idx_직원_이름 ON 직원(이름);', '이 실습의 데이터는 몇 행뿐이라 속도 차이는 못 느끼지만, 수백만 행에서는 큰 차이가 나요.'),
    TRY('CREATE UNIQUE INDEX uq_직원_이름 ON 직원(이름);', 'UNIQUE 인덱스는 중복을 허용하지 않는 인덱스예요.'),
    TRY("INSERT INTO 직원 VALUES (7, '한솔', '인사', 300);", '❌ 이름 한솔이 이미 있어서 UNIQUE 인덱스가 막아요.'),

LESSONS.push({ id: 'L12', title: '되돌릴 수 있게 — 트랜잭션', min: 8, data: 'school',
  goal: 'COMMIT·ROLLBACK·SAVEPOINT의 동작을 예측하고, 트랜잭션의 4가지 성질(ACID)을 설명할 수 있다.',
  blocks: [
    P('은행 이체를 생각해 보세요. A 계좌에서 10만 원을 빼고(UPDATE), B 계좌에 10만 원을 더하는(UPDATE) 사이에 오류가 나면? <b>둘 다 되거나 둘 다 안 돼야</b> 해요. 이렇게 <b>하나의 논리적 작업 단위</b>로 묶인 SQL 묶음을 <b>트랜잭션</b>이라고 해요.'),
    { t: 'terms', items: [['COMMIT', '지금까지의 변경을 <b>영구 확정</b>'], ['ROLLBACK', '마지막 COMMIT 이후의 변경을 <b>모두 취소</b>'], ['SAVEPOINT 이름', '중간 저장점 표시'], ['ROLLBACK TO 이름', '그 저장점 <b>이후</b>의 변경만 취소']] },
    TIP('이 실습에서 <b>BEGIN</b> 없이 쓴 INSERT/UPDATE/DELETE는 곧바로 확정(자동 커밋)돼요. <b>BEGIN</b>으로 트랜잭션을 시작하면 COMMIT 전까지는 <b>임시 상태</b>예요. (Oracle은 BEGIN 없이도 COMMIT 전까지 임시 상태이고, DDL은 자동 커밋이에요.) 결과 메시지의 <b>"아직 COMMIT 전 — 임시"</b> 표시를 보세요.'),
    H('1. ROLLBACK — 없던 일로'),
    TRY('BEGIN;', '트랜잭션 시작'),
    TRY('DELETE FROM 학생;\nSELECT COUNT(*) FROM 학생;', '다 지워졌어요. 하지만 아직 임시!'),
    TRY('ROLLBACK;\nSELECT COUNT(*) FROM 학생;', '6명이 돌아왔어요!'),
    H('2. COMMIT — 확정'),
    TRY("BEGIN;\nUPDATE 학생 SET 점수 = 100 WHERE 이름 = '도윤';\nCOMMIT;\nROLLBACK;\nSELECT 이름, 점수 FROM 학생 WHERE 이름 = '도윤';", 'COMMIT으로 확정한 뒤에는 ROLLBACK을 해도 되돌릴 수 없어요. 도윤은 100점 그대로!'),
    H('3. SAVEPOINT — 부분 되돌리기'),
    TRY("BEGIN;\nUPDATE 학생 SET 점수 = 0 WHERE 이름 = '민수';\nSAVEPOINT sp1;\nUPDATE 학생 SET 점수 = 0 WHERE 이름 = '지민';\nSELECT 이름, 점수 FROM 학생 WHERE 이름 IN ('민수','지민');", '민수와 지민 모두 0점 (임시)'),
    TRY("ROLLBACK TO sp1;\nSELECT 이름, 점수 FROM 학생 WHERE 이름 IN ('민수','지민');", '저장점 이후(지민)만 취소 → 지민 91점 복구, 민수는 여전히 0점!'),
    TRY("ROLLBACK;\nSELECT 이름, 점수 FROM 학생 WHERE 이름 IN ('민수','지민');", '전체 ROLLBACK → 민수도 복구.'),
    WARN('<b>DDL(CREATE/ALTER/DROP/TRUNCATE)은 실행과 동시에 자동 커밋</b>돼서 ROLLBACK으로 되돌릴 수 없어요. (Oracle 기준) 그래서 TRUNCATE는 DELETE보다 위험해요.'),
    H('4. 트랜잭션의 4가지 성질 — ACID'),
    { t: 'terms', items: [['원자성 (Atomicity)', '전부 실행되거나 전부 실행되지 않는다 (All or Nothing)'], ['일관성 (Consistency)', '실행 전후에 DB가 규칙(제약조건)을 지키는 일관된 상태'], ['고립성 (Isolation)', '동시에 실행되는 다른 트랜잭션의 간섭을 받지 않는다'], ['지속성 (Durability)', '커밋된 결과는 장애가 나도 영구히 보존된다']] },
    QUIZ("BEGIN;\nDELETE FROM 학생 WHERE 학과 = 'IT';\nROLLBACK;\nSELECT COUNT(*) FROM 학생;", ['6', '3', '0'], 'DELETE를 ROLLBACK으로 취소했으니 6명 그대로예요.'),
    QUIZ("BEGIN;\nDELETE FROM 학생 WHERE 학과 = 'IT';\nCOMMIT;\nROLLBACK;\nSELECT COUNT(*) FROM 학생;", ['3', '6', '0'], 'COMMIT으로 확정된 뒤에는 ROLLBACK이 되돌릴 게 없어요. IT 3명이 삭제된 채 3명이 남아요.'),
    QUIZ("BEGIN;\nUPDATE 학생 SET 점수 = 0 WHERE 이름 = '민수';\nSAVEPOINT a;\nUPDATE 학생 SET 점수 = 0 WHERE 이름 = '지민';\nROLLBACK TO a;\nCOMMIT;\nSELECT 이름, 점수 FROM 학생 WHERE 이름 IN ('민수', '지민');", ['민수 0 / 지민 91', '민수 82 / 지민 91', '민수 0 / 지민 0'], '저장점 a 이후(지민 수정)만 취소되고, 민수의 수정은 COMMIT으로 확정돼요.'),
    QS('트랜잭션의 성질 중 "모두 실행되거나 전혀 실행되지 않아야 한다"에 해당하는 것은?', ['원자성', '일관성', '고립성', '지속성'], 0, 'All or Nothing은 원자성(Atomicity)이에요.'),
    QS('다음 중 <b>ROLLBACK으로 되돌릴 수 없는</b> 것은?', ['INSERT 후 COMMIT 전', 'UPDATE 후 COMMIT 전', 'DELETE 후 COMMIT 전', 'COMMIT 이후의 변경'], 3, 'ROLLBACK은 마지막 COMMIT 이후의 변경만 취소해요.'),
    MISSION('m12-1', '<b>BEGIN</b>으로 시작해서 <b>도윤을 삭제</b>하고 <b>COMMIT</b>으로 확정하세요.', "BEGIN; DELETE FROM 학생 WHERE 이름 = '도윤'; COMMIT;", ['BEGIN; … ; COMMIT; 순서로', "DELETE FROM 학생 WHERE 이름 = '도윤'"]),
    MISSION('m12-2', '<b>BEGIN</b> 후 학생 전원의 점수를 <b>0</b>으로 바꿨다가, <b>ROLLBACK</b>으로 취소해서 원래대로 돌려놓으세요.', 'BEGIN; UPDATE 학생 SET 점수 = 0; ROLLBACK;', ['BEGIN; UPDATE …; ROLLBACK;']),
    MISSION('m12-3', "<b>BEGIN</b> → 민수 점수를 <b>0</b>으로 수정 → <b>SAVEPOINT s1</b> → 지민 점수를 <b>0</b>으로 수정 → <b>ROLLBACK TO s1</b> → <b>COMMIT</b>. 결과는 민수만 0점이 돼야 해요.", "BEGIN; UPDATE 학생 SET 점수 = 0 WHERE 이름 = '민수'; SAVEPOINT s1; UPDATE 학생 SET 점수 = 0 WHERE 이름 = '지민'; ROLLBACK TO s1; COMMIT;", ['순서를 그대로 문장으로 옮겨 보세요.', 'SAVEPOINT s1; 와 ROLLBACK TO s1;'])
  ] });

LESSONS.push({ id: 'L13', title: '누가 무엇을 할 수 있나 — 권한 (DCL)', min: 5, data: 'school',
  goal: 'GRANT·REVOKE로 사용자 권한을 주고 회수할 수 있다.',
  blocks: [
    P('여러 사람이 쓰는 DB에서는 <b>사용자마다 할 수 있는 일</b>을 다르게 해야 해요. 이때 쓰는 DCL(데이터 제어어)이 <b>GRANT</b>(권한 부여)와 <b>REVOKE</b>(권한 회수)예요. 이 실습에는 <b>관리자</b>와 <b>민수</b>라는 두 사용자가 있고, 아래 예제는 <b>누구로 실행되는지</b>(👤 표시)가 정해져 있어요. (실제 DB 서버의 권한 시스템을 단순하게 흉내 낸 것이에요.)'),

    TRY('SELECT * FROM 학생;', '아직 아무 권한이 없는 민수가 조회하면?', { as: '민수' }),
    TRY('GRANT SELECT ON 학생 TO 민수;', '관리자가 민수에게 조회 권한을 줘요.'),
    TRY('SELECT * FROM 학생;', '이제 민수도 조회가 돼요!', { as: '민수' }),
    TRY("UPDATE 학생 SET 점수 = 0;", '하지만 SELECT 권한만 있으니 수정은 불가!', { as: '민수' }),
    TRY('GRANT INSERT, UPDATE ON 학생 TO 민수;', '권한은 여러 개를 한 번에 줄 수 있어요.'),
    TRY("UPDATE 학생 SET 점수 = 99 WHERE 이름 = '도윤';", '이제 수정 가능!', { as: '민수' }),
    TRY('REVOKE UPDATE ON 학생 FROM 민수;', '권한 회수는 FROM!'),
    TRY("UPDATE 학생 SET 점수 = 0 WHERE 이름 = '도윤';", '다시 막혔어요.', { as: '민수' }),

    TIP('GRANT 문에서는 <b>TO</b>, REVOKE 문에서는 <b>FROM</b>을 써요. 시험에서 자주 헷갈려요! <b>WITH GRANT OPTION</b>을 붙이면 받은 사용자가 다른 사람에게 그 권한을 다시 줄 수도 있어요.'),

    QS('다음 중 DCL에 해당하는 명령만 고른 것은?', ['SELECT, INSERT', 'CREATE, DROP', 'GRANT, REVOKE', 'COMMIT, ROLLBACK'], 2, 'GRANT/REVOKE = DCL, COMMIT/ROLLBACK = TCL, CREATE/DROP = DDL, SELECT/INSERT = DML.'),
    MISSION('m13-1', '사용자 <b>민수</b>에게 <b>학생</b> 표의 <b>SELECT, DELETE</b> 권한을 주세요.', 'GRANT SELECT, DELETE ON 학생 TO 민수', ['GRANT 권한, 권한 ON 표 TO 사용자']),
    MISSION('m13-2', '먼저 민수에게 학생 표의 SELECT 권한을 주고, 이어서 그 권한을 <b>회수</b>하세요. (결과적으로 아무 권한도 없는 상태)', 'GRANT SELECT ON 학생 TO 민수; REVOKE SELECT ON 학생 FROM 민수;', ['REVOKE 권한 ON 표 FROM 사용자'])
  ] });
